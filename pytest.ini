[pytest]
# Repo-root suite = the OBSERVE-owned engine tests. The vendored sentinel_os/
# tree has its own CI invocation (`.github/workflows/tests.yml` runs
# `python -m pytest .` with working-directory: sentinel_os), and imports/ is
# raw archived material — neither should be collected from the root.
testpaths =
    test_observe_consolidated.py
    test_observe_invariants.py
addopts = --import-mode=importlib
